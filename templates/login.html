{% extends "base.html" %}
{% block content %}
<div class="formcard">
    <h1>Teacher Login</h1>
    <form method="post">
        <label>Username<input name="username" required autocomplete="username"></label>
        <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
        <button>Login</button>
    </form>
    <p class="muted">New teacher? <a href="{{ url_for('teacher_register') }}">Create an account</a></p>
</div>
{% endblock %}
