{% extends "base.html" %}
{% block content %}
<div class="formcard">
    <h1>Teacher Registration</h1>
    <p class="muted">Create your teacher account.</p>
    <form method="post">
        <label>Username<input name="username" required maxlength="50" autocomplete="username"></label>
        <label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
        <label>Confirm Password<input type="password" name="confirm_password" required minlength="8" autocomplete="new-password"></label>
        <button>Create Account</button>
    </form>
    <p class="muted">Already registered? <a href="{{ url_for('teacher_login') }}">Login</a></p>
</div>
{% endblock %}
